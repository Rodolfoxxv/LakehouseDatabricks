# Declarative Automation Bundle definition for grid_intelligence.
bundle:
  name: grid_intelligence
  uuid: b2800fbc-f50f-4499-83bd-1ce7cd15aaa4

include:
  - resources/*.yml

experimental:
  skip_name_prefix_for_schema: true

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: The catalog to use
  warehouse_id:
    description: SQL Warehouse ID for dashboards
    default: "c2d015b31194d84d"

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: grid_intelligence
    variables:
      catalog: grid_dev
      warehouse_id: "c2d015b31194d84d"
  prod:
    mode: production
    workspace:
      profile: grid_intelligence
      root_path: /Workspace/Users/rodolfoxae@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: grid_intelligence
      warehouse_id: "c2d015b31194d84d"
    permissions:
      - user_name: rodolfoxae@gmail.com
        level: CAN_MANAGE
